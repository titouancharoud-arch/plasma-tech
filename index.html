<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Plasma Tech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0a0a0f;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(0,0,0,0.7);
    }

    .logo {
      font-size: 24px;
      letter-spacing: 3px;
      font-weight: bold;
    }

    .logo span {
      color: #ff2fd2;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    nav a:hover {
      color: #ff4ecd;
    }

    .hero {
      padding: 120px 40px;
      max-width: 900px;
    }

    .hero h2 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 18px;
      color: #cccccc;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #888;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">PLASMA <span>TECH</span></div>
  <nav>
    <a href="#">Accueil</a>
    <a href="#">Robotique</a>
    <a href="#">Projets</a>
    <a href="#">Contact</a>
  </nav>
</header>

<div class="hero">
  <h2>Ingénierie Robotique & Aéronautique</h2>
  <p>
    Plasma Tech développe des solutions robotiques,
    électromécaniques et aéronautiques modernes.
  </p>
</div>

<footer>
  © 2025 Plasma Tech
</footer>

</body>
</html>
